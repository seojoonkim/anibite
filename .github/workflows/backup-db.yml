name: Backup tooling self-test (not a production backup)

# The previous job copied a live SQLite main file and published it as a
# release. Do not restore scheduling until a PRIVATE encrypted destination,
# a server-side consistent snapshot, and restore drills are configured.
# See docs/SAFE_BACKUPS.md. This workflow never accesses production data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify snapshot safety against synthetic temporary databases
        run: python -m unittest discover -s scripts/tests -v
