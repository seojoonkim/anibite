name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-test-results
          path: frontend/test-results
          retention-days: 3

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest pip-audit
      - name: Isolated backend regressions (temporary DBs only)
        run: python -m pytest backend/tests -q
      - name: Real HTTP smoke (synthetic temporary DB only)
        run: python scripts/http_smoke.py
      - name: Local backup tooling safety
        run: python -m unittest discover -s scripts/tests -v
      - name: Dependency security audit
        run: pip-audit
      - name: Build release container without production data
        run: docker build --tag anibite-release-check .
